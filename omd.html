<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O.M.D | Luxury Perfumes</title>
    <!-- خطوط عربية وأجنبية فخمة تتناسب مع الهوية -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body {
            background-color: #0b1014; /* لون الخلفية المستوحى بدقة من الهوية البصرية */
            color: #d1c7b7; /* لون نص بيج ناعم وراقي */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 420px;
            background: #10161c; /* لون بطاقة داكن متناسق مع اللوجو */
            border: 2px solid #b3a286; /* إطار بيج/ذهبي فخم مستوحى من اللوجو */
            border-radius: 28px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(179, 162, 134, 0.05);
        }

        .logo-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #b3a286;
            box-shadow: 0 0 20px rgba(179, 162, 134, 0.25);
            background: #0b1014;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-family: 'Cinzel', serif; /* خط أجنبي فخم مطابق لطابع الماركة */
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #d8cbb8; /* لون بيج مضيء للاسم */
            letter-spacing: 3px;
        }

        p.bio {
            font-size: 13px;
            color: #9c9180; /* لون بيج هادئ للوصف */
            margin-bottom: 25px;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #151c23; /* لون خلفية الأزرار متناسق مع الطابع العام */
            color: #d1c7b7;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            border: 1px solid rgba(179, 162, 134, 0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            border-color: #b3a286;
            background: #1b232b;
        }

        /* تخصيص تأثيرات الأيقونات عند التحويم */
        .link-btn.whatsapp:hover { border-color: #25D366; background: rgba(37, 211, 102, 0.1); }
        .link-btn.instagram:hover { border-color: #E1306C; background: rgba(225, 48, 108, 0.1); }

        .link-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-btn i {
            font-size: 22px;
        }

        .whatsapp i { color: #25D366; }
        .instagram i { color: #E1306C; }

        .arrow {
            font-size: 14px;
            color: #9c9180;
        }

        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #7a7062;
            border-top: 1px solid rgba(179, 162, 134, 0.15);
            padding-top: 15px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- شعار الماركة -->
        <div class="logo-container">
            <img src="omd.jpg" alt="O.M.D Perfumes" id="c-logo">
        </div>
        
        <!-- اسم الماركة -->
        <h1>O . M . D</h1>
        
        <!-- نبذة تعريفية قصيرة -->
        <p class="bio">
            Exclusive Luxury Perfumes <br> عطور فاخرة تليق بذوقك الرفيع
        </p>
        
        <!-- أزرار التواصل -->
        <div class="links-list">
            <!-- رابط الواتساب بالرقم الجديد -->
            <a href="https://wa.me/970592700870" class="link-btn whatsapp" target="_blank">
                <div class="link-content">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>WhatsApp</span>
                </div>
                <i class="fa-solid fa-angle-left arrow"></i>
            </a>

            <!-- رابط إنستغرام الجديد -->
            <a href="https://www.instagram.com/omd.ps?utm_source=ig_web_button_share_sheet&stkn=ZDNlZDc0MzIxNw==" class="link-btn instagram" target="_blank">
                <div class="link-content">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Instagram</span>
                </div>
                <i class="fa-solid fa-angle-left arrow"></i>
            </a>
        </div>

        <div class="footer">
            جميع الحقوق محفوظة Des Program © 2026
        </div>
    </div>

</body>
</html>
